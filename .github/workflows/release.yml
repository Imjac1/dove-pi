name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:installer
      - run: npm run doctor
      - run: npm run pi:smoke
      - run: npm run release:manifest -- "$env:RUNNER_TEMP\release.json"
      - name: Assemble release asset
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'dove-pi-release'
          # **What a release archive contains is defined in one place**, `scripts/stage-release.ps1`, so this workflow
          # and a local replay cannot drift apart on the include list - drift here produces an archive whose contents
          # differ between the machine that tested it and the machine that shipped it. Two of its entries are worth
          # keeping in view without opening it: `modes` is product content the runtime reads, and a mode without its
          # `MODE.md` refuses every tool call the moment it is selected; `LICENSE` and `NOTICE` are staged because
          # Apache-2.0 section 4(a) gives every recipient a copy of the Licence, and the zip is where they get it.
          # Caches are excluded there by name, and `scripts/check_release_readiness.py` refuses an archive that still
          # carries one - the assembly half and the enforcement half of the same rule.
          ./scripts/stage-release.ps1 -Stage $stage -GeneratedAssets "$env:RUNNER_TEMP\release.json"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath 'dove-pi-windows.zip'
          $hash = (Get-FileHash -LiteralPath 'dove-pi-windows.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'dove-pi-windows.zip.sha256' -Value "$hash  dove-pi-windows.zip" -Encoding ascii
      - name: Verify release readiness
        shell: pwsh
        run: >-
          npm run release:check --
          --tag "$env:GITHUB_REF_NAME"
          --commit "$env:GITHUB_SHA"
          --manifest "$env:RUNNER_TEMP\release.json"
          --archive "dove-pi-windows.zip"
          --checksum "dove-pi-windows.zip.sha256"
          --bootstrap "install.ps1"
          --asset "dove-pi-windows.zip"
          --asset "dove-pi-windows.zip.sha256"
          --asset "install.ps1"
          --asset "$env:RUNNER_TEMP\release.json"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dove-pi-windows.zip
            dove-pi-windows.zip.sha256
            install.ps1
            ${{ runner.temp }}/release.json
