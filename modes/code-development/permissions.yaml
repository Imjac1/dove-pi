# The list decides what the agent may do, so every entry names an action that can occur.
#
# `unlisted: allow` is the stance, stated rather than defaulted: development is mostly ordinary work,
# and asking on every read would be noise. What contains this mode is this list together with
# `authority.capabilities` in governance.yaml - **not** the `scope` block, whose only field any code
# reads is `exclusions`, and this mode declares none. (code-audit's files say the scope block is part of
# its containment; for this mode that would be a claim with nothing behind it.)
unlisted: allow

# Nothing is asked about. code-audit asks before every write and documents that this is stricter than it
# intended, because the list is name-based while the intent was about the argument. For a mode whose
# whole purpose is changing files, asking per write would make it unusable rather than safe.
ask_before: []

# **The network is not listed here, on purpose.** `sandbox.network: none` in governance.yaml is the one
# control for it: it blocks the host's network tools at the tool boundary and reports the way out. An
# earlier version of this file repeated those eight tool names here as well, which read as two controls
# while only one of them could ever fire - the permission list runs first, so the sandbox branch was
# unreachable for exactly those names. One control, stated once.
#
# What is listed is capability-shaped and matches real capabilities: the registry carries
# `web.access_status` and `web.real_user_setup`, and the second is a `system_change`. A development mode
# does not set up a user environment or report network access status, so it refuses the family. The
# scope gate refuses them anyway, because they are not in `authority.capabilities` - this line states
# the intent rather than adding a second enforcement, and says so instead of claiming otherwise.
never_allow:
  - web.*
