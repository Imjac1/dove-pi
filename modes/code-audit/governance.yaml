version: 1.8.0
framework: ">=0.2.0 <0.3.0"

scope:
  targets: [repository]
  environment: non-production
  exclusions: []

authority:
  grant: local-review
  # **Two namespaces, and this list holds both on purpose.** `code-audit.seed`, `code-audit.disposition` and `code-audit.diff` are
  # capability names: they are in the registry `dove-pi capability list` prints. `repo.read` and `report.write` are this mode own
  # action names, declared in permissions.yaml and given an idempotency class below. A grant covers what the mode may do, which is both
  # kinds, and the loader does not resolve them against the registry - measured, and it is why a reader should not assume every dotted
  # name here is a capability.
  capabilities: [repo.read, report.write, code-audit.seed, code-audit.disposition, code-audit.diff]
  expires: "2027-01-01T00:00:00.000Z"

gate:
  # `none`, and every other value would be a claim this mode cannot support.
  #
  # Not `conformance`: that is checked against an authority *document*, and this mode has no external grantor to
  # write one. `ownership_evidence` exists to record a third party's permission to test their asset, and an
  # internal review has no such third party. Declaring conformance made the mode refuse to load - correct for a
  # mode whose containment cannot be established, and the loader's message named this field as the way out.
  #
  # Not `limit` either, which is what this file said until 2026-09-27: that value means the mode is bounded by
  # thresholds, and this one declares none. `limit` was the loader's suggested escape and it left the field
  # reading as a control that did not exist. What contains this mode is the permission list and the scope block
  # above, and MODE.md says so rather than leaving it to be inferred from `gates`.
  semantics: none
  approval: none

# Which effects a retry may repeat. An undeclared tool is non-idempotent, so this map grants rather than
# denies: it names only what a second run genuinely cannot duplicate. The claim at the dispatch line reads
# it through effectClassOf, which reports an undeclared tool as a default rather than as a declaration.
effects:
  classes:
    # The audit spine is reproducible by construction - the same receipt produces the same findings, and the
    # report is overwritten rather than appended - so a retry cannot double it.
    code-audit.seed: idempotent
    code-audit.disposition: idempotent
    code-audit.diff: idempotent
    repo.read: idempotent
    report.write: idempotent
    # A second read of the same path is the same read.
    read: idempotent
    grep: idempotent
    find: idempotent
    ls: idempotent
    # `write` replaces a file with the content it is given, so a second write leaves the same state. `edit`
    # applies a patch, and a patch applied twice is not the state one application produced - so `edit` is
    # absent here, as are `bash` and `powershell`. The default covers them, and the default is the safe one.

sandbox:
  # The two claims this runtime can actually enforce, and does, at the tool boundary: no tool that
  # performs network access runs under this mode, and no tool that mutates the filesystem runs at all -
  # the audit reads. `isolation: worktree` was deleted rather than left here: it requires an OS sandbox
  # this runtime does not provide, and a claim the runtime cannot honour refuses to load instead of
  # reading as containment. The write-protection that matters is enforced; where the writes would land
  # is not, and the mode does not pretend otherwise.
  network: none
  filesystem: read-only-source

session:
  memory_scope: project
  budget:
    turns: 40
    tokens: 400000
    cost_multiplier: 1.0
    exploration: 0

evidence:
  format: sarif
  artifacts: [report.sarif, coverage.json]
  retention: 90d
  isolation: per-engagement

coordination:
  aware_contact: repo-owner
  incident_reporting: none
  cadence:
    plans: true
    progress: true
    problems: true

stop:
  on: [budget-exhausted, findings-stable]
  emergency_stop: operator