version: 1.4.0
framework: ">=0.2.0 <0.3.0"

scope:
  targets: [sandbox-venue]
  environment: non-production
  # **No `exclusions`.** It named `production-venue`, and this mode's gate carries no `target_argument` - so the
  # exclusion could never refuse anything, and the loader refuses a list it cannot enforce now, for the same reason it
  # refuses a mode-level expiry. **That is a real loss**: one line used to say production venues were out of reach.
  # What remains is the paper-only target scope below and the permission list.

authority:
  # **No `grant` name.** This mode declared `local-paper-trading`, and no such document exists: paper trading is
  # bounded by this file's thresholds and by the scope block's `exclusions: [production-venue]`, not by an engagement
  # document. A name that resolves to nothing reads as authority nobody granted, so the loader refuses one now.
  capabilities: [market.read, order.submit]
  # No `expires`: the runtime refuses it as unenforceable - see the note in `modes/pentest/governance.yaml`.

gate:
  semantics: limit
  limits:
    # `tools` is not decoration: without it a limit is evaluated against *every* action, so the notional cap
    # refused `bash`, `read` and `edit` for want of an `order.notional` field. A threshold belongs to the action
    # that carries the value it checks, and the gate can only know which action that is if the mode says so.
    notional:
      argument: order.notional
      max: 100000
      unit: USD
      tools: [order.submit]
    quantity:
      argument: order.quantity
      min: 1
      max: 10000
      tools: [order.submit]
  # No `approval`: nothing read it (see the note in pentest).

sandbox:
  # Only what this runtime can honour. Paper trading needs the market feed, so the network stays
  # unrestricted; the containment that matters is that nothing here touches a production venue, which is
  # the scope block's job (targets: [sandbox-venue]), not an OS sandbox
  # this runtime does not have. `container`/`allowlist`/`ephemeral` would refuse to load.
  isolation: none
  network: unrestricted
  filesystem: unrestricted

session:
  # `turns` is honoured; the other three budget fields are gone because nothing meters them, and `memory_scope` is gone
  # with them: nothing in this runtime scopes memory by mode, and the loader refuses the field by name now.
  budget:
    turns: 20

# **`evidence` and `coordination` dropped, with the loss written down.** `retention: 2555d` is the one that mattered
# most, and it is exactly the promise this runtime cannot keep: nothing deletes an order log by age. The desk's
# contacts are gone with it.
stop:
  on: [maxTurns, stopped]
  # `emergency_stop: operator` is gone: nothing read it, so the loader refuses it (see the note in pentest).
